name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: smartphone-hmd-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: smartphone-hmd-camera-apk
          path: android/camera/build/outputs/apk/debug/camera-debug.apk

  android-smoke:
    name: Android app starts (emulator)
    needs: android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smartphone-hmd-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: smartphone-hmd-camera-apk
          path: camera-apk
      # To decode the camera app's self-test video as the PC does.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install av
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/android_smoke_test.sh apk/app-debug.apk && bash tools/ci/camera_smoke_test.sh camera-apk/camera-debug.apk

  body-tracker:
    name: PC body tracker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          # MediaPipe needs these on Linux; Windows has what it needs.
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgles2; fi
          pip install -r tools/requirements-body.txt
      - name: Test
        run: python -m unittest discover -s tools -p "test_*.py" -v

  driver:
    name: SteamVR driver (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S driver -B driver/build -A x64
      - name: Build
        run: cmake --build driver/build --config Release
      - name: Test
        run: ctest --test-dir driver/build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: smartphone_hmd-driver
          path: driver/build/smartphone_hmd
